<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lobby – Országváros</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
<section class="card">
<div class="home-hero"><div class="small">JÁTÉK LOBBY</div><h1 style="font-size:34px">Váróterem</h1><p class="subtitle">Hívd meg a többieket a szobakóddal.</p></div>
<div class="room-code">SZOBÁKÓD<strong>{{ code }}</strong></div>

<div id="join-panel">
<label for="name">Játékosnév</label>
<input id="name" maxlength="20" placeholder="Írd be a neved">
<button id="join-btn" class="button primary full">Belépés</button>
</div>

<div id="lobby-panel" class="hidden">
<h2>👥 Játékosok</h2>
<div id="players"></div>

<div id="host-controls" class="hidden">
<div class="settings-box custom-category-box">
<label>Egyedi kategóriák</label>
<p class="muted">A 7 alap kategória mindig benne marad. Adj hozzá annyi saját kategóriát, amennyit szeretnél.</p>
<div class="custom-category-add">
<input id="custom-category-input" maxlength="50" placeholder="pl. Film, Étel, Autómárka...">
<button id="add-category-btn" class="button secondary" type="button">＋ Hozzáadás</button>
</div>
<div id="custom-category-list" class="custom-category-list"></div>
</div>

<div class="settings-box">
<label for="rounds">Körök száma</label>
<select id="rounds">
<option value="1">1 kör</option><option value="2">2 kör</option><option value="3">3 kör</option>
<option value="4">4 kör</option><option value="5" selected>5 kör</option><option value="6">6 kör</option>
<option value="7">7 kör</option><option value="8">8 kör</option><option value="9">9 kör</option><option value="10">10 kör</option>
</select>
<p class="muted">Egy meccsen belül ugyanaz a betű nem kerül elő újra.</p>
</div>
<button id="start-btn" class="button primary full">⚡ Játék indítása</button>
</div>
<div id="round-info" class="info hidden"></div>

<p id="host-info" class="muted"></p>
</div>

<div id="message"></div>
</section>
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const socket = io({transports: ["polling"]});
const code = "{{ code }}";
let joined = false;

const nameInput = document.getElementById("name");
const joinPanel = document.getElementById("join-panel");
const lobbyPanel = document.getElementById("lobby-panel");
const message = document.getElementById("message");

const savedName = sessionStorage.getItem("ov_name");
if (savedName) nameInput.value = savedName;

document.getElementById("join-btn").onclick = join;

nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") join();
});

function join() {
    const name = nameInput.value.trim();
    if (!name) {
        showError("Írd be a neved.");
        return;
    }
    socket.emit("join_game", {code, name});
}

socket.on("joined", data => {
    joined = true;
    sessionStorage.setItem("ov_name", data.name);
    joinPanel.classList.add("hidden");
    lobbyPanel.classList.remove("hidden");

    if (data.state !== "lobby") {
        window.location.href = `/game/${code}`;
    }
});

socket.on("state", state => {
    renderPlayers(state);
    syncCategoriesFromState(state);

    if (state.state !== "lobby") {
        window.location.href = `/game/${code}`;
    }
});

const customCategoryInput = document.getElementById("custom-category-input");
const customCategoryList = document.getElementById("custom-category-list");
let customCategories = [];

document.getElementById("add-category-btn").onclick = addCustomCategory;
customCategoryInput.addEventListener("keydown", e => {
    if (e.key === "Enter") addCustomCategory();
});

function addCustomCategory() {
    const value = customCategoryInput.value.trim();
    if (!value) return;
    if (customCategories.some(x => x.toLowerCase() === value.toLowerCase())) {
        showError("Ez a kategória már szerepel.");
        return;
    }
    customCategories.push(value);
    customCategoryInput.value = "";
    saveCustomCategories();
    renderCustomCategories();
}

function removeCustomCategory(index) {
    customCategories.splice(index, 1);
    saveCustomCategories();
    renderCustomCategories();
}

function saveCustomCategories() {
    socket.emit("set_custom_categories", {code, categories: customCategories});
}

function renderCustomCategories() {
    customCategoryList.innerHTML = "";
    customCategories.forEach((name, index) => {
        const tag = document.createElement("div");
        tag.className = "custom-category-tag";
        tag.innerHTML = `<span>✦ ${esc(name)}</span><button type="button" title="Eltávolítás">×</button>`;
        tag.querySelector("button").onclick = () => removeCustomCategory(index);
        customCategoryList.appendChild(tag);
    });
}

function syncCategoriesFromState(state) {
    const baseLabels = new Set(["Ország","Város","Fiú","Lány","Növény","Állat","Tárgy"]);
    customCategories = (state.categories || [])
        .map(item => Array.isArray(item) ? item[1] : "")
        .filter(label => label && !baseLabels.has(label));
    renderCustomCategories();
}

document.getElementById("rounds").onchange = e => {
    socket.emit("set_rounds", {code, rounds: Number(e.target.value)});
};

document.getElementById("start-btn").onclick = () => {
    socket.emit("start_game", {code});
};

socket.on("host_changed", data => {
    showInfo(data.message);
});

socket.on("error_message", data => showError(data.message));

function renderPlayers(state) {
    const list = document.getElementById("players");
    list.innerHTML = "";

    state.players.forEach(p => {
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML =
            `<span>${esc(p.name)}</span><span>${p.is_host ? "👑 Host" : "Játékos"}</span>`;
        list.appendChild(row);
    });

    const me = sessionStorage.getItem("ov_name");
    const host = state.players.find(p => p.is_host);
    const amHost = host && host.name === me;

    document.getElementById("host-controls")
        .classList.toggle("hidden", !amHost);

    document.getElementById("host-info").textContent =
        amHost ? "Te vagy a Host." : (host ? `Host: ${host.name}` : "");

    document.getElementById("round-info").classList.remove("hidden");
    document.getElementById("round-info").textContent =
        `Beállított körök száma: ${state.total_rounds}`;
    const select = document.getElementById("rounds");
    if (document.activeElement !== select) select.value = String(state.total_rounds);
}

function showError(text) {
    message.innerHTML = `<div class="error">${esc(text)}</div>`;
}

function showInfo(text) {
    message.innerHTML = `<div class="info">${esc(text)}</div>`;
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
}
</script>
</body>
</html>
