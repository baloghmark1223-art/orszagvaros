<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Országváros • Játék</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container wide">

<header class="game-header">

    <div class="game-brand">

        <div class="game-mini-logo">
            👑
        </div>

        <div>

            <div class="small">
                ORSZÁGVÁROS
            </div>

            <h1 id="round-title">
                1. KÖR / 10
            </h1>

        </div>

    </div>

    <div class="score-header">
        👥 <span id="player-count">4</span> játékos
    </div>

</header>

<div class="progress-shell">

    <div
        id="progress-bar"
        class="progress-bar">
    </div>

</div>

<section id="playing-view" class="card hidden">
  <div class="letter-box">
    AKTUÁLIS BETŰ
    <strong id="letter">?</strong>
  </div>
  <div id="used-letters" class="used-letters">Korábban: </div>
  <div id="form-fields" class="categories"></div>
  <button id="ready-btn" class="button primary full">✓ KÉSZ — VÁLASZOK LEADÁSA</button>
  <div id="ready-status" class="ready-status"><span id="ready-dot" class="dot"></span><span id="ready-text">Még nincs leadva</span></div>
  <div id="submitted" class="success hidden">✓ Leadva! Várj a többiekre.</div>
</section>

<section id="review-view" class="card hidden">
  <div class="small">HOST PANEL</div>
  <h2 id="review-title">Válaszok értékelése</h2>
  <p class="muted">A Host minden választ külön elfogadhat ✓ vagy elutasíthat ✕.</p>
  <div id="review-table"></div>
  <button id="next-btn" class="button primary full hidden">Következő kör</button>
</section>

<section id="finished-view" class="card hidden">

    <div class="finished-hero">

        <div class="trophy">
            🏆
        </div>

        <div class="small">
            MECCS VÉGE
        </div>

        <h2>
            VÉGEREDMÉNY
        </h2>

        <p class="subtitle">
            A játék véget ért!
        </p>

    </div>


    <!-- DOBogó -->

    <div
        id="podium"
        class="podium">
    </div>


    <!-- Teljes ranglista -->

    <div
        id="final-results">
    </div>


    <!-- ÚJ JÁTÉK -->

    <div class="new-game-wrap">

        <a
            href="/"
            class="button primary new-game-button">

            ↻ ÚJ JÁTÉK

        </a>

    </div>

</section>

<div id="error"></div>
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const socket = io({transports:["polling"]});
const code = "{{ code }}";
const myName = sessionStorage.getItem("ov_name") || "";
let isHost=false, categories=[], currentState="unknown", currentRound=0, totalRounds=0;

const categoryIcons = {
  country:"🌍", city:"🏙️", boy:"👦", girl:"👧", plant:"🌿", animal:"🐾", object:"◈"
};

socket.on("connect",()=>socket.emit("join_game",{code,name:myName}));

socket.on("joined",data=>{ isHost=data.is_host; });

socket.on("state",state=>{
  currentState=state.state;
  const me=state.players.find(p=>p.name===myName);
  isHost=!!(me&&me.is_host);
  document.getElementById("player-count").textContent=state.players.length;
  if(state.total_rounds) totalRounds=state.total_rounds;
  if(state.state==="finished") show("finished-view");
});

socket.on("round_started",data=>{
  currentState="playing"; categories=data.categories; currentRound=Number(data.round); totalRounds=Number(data.total_rounds);
  document.getElementById("round-title").textContent=`${data.round}. KÖR / ${data.total_rounds}`;
  document.getElementById("letter").textContent=data.letter;
  document.getElementById("progress-bar").style.width=`${Math.min(100,(data.round/data.total_rounds)*100)}%`;

  const used=document.getElementById("used-letters");
  used.innerHTML="Korábban: ";
  (data.used_letters||[]).forEach((l,i)=>{
    const s=document.createElement("span");s.textContent=l;used.appendChild(s);
  });

  const fields=document.getElementById("form-fields"); fields.innerHTML="";
  const categoryIcons = {
        country: "🌍",
        city: "🏙️",
        boy: "👦",
        girl: "👧",
        plant: "🌿",
        animal: "🐾",
        object: "◈"
    };

    data.categories.forEach(([key, label]) => {

        const box = document.createElement("div");

        box.className = "category";

        box.innerHTML = `
            <label>
                <span class="cat-icon">
                    ${categoryIcons[key] || "✦"}
                </span>

                ${label}
            </label>

            <input
                id="answer-${key}"
                maxlength="100"
                autocomplete="off"
                placeholder="${data.letter} betűvel..."
            >
        `;

        fields.appendChild(box);
    });
  document.getElementById("ready-btn").disabled=false;
  document.getElementById("submitted").classList.add("hidden");
  document.getElementById("ready-dot").classList.remove("live");
  document.getElementById("ready-text").textContent="Még nincs leadva";
  show("playing-view");
});

document.getElementById("ready-btn").onclick=()=>{
  const answers={};
  categories.forEach(([key])=>{
    const input=document.getElementById(`answer-${key}`);
    answers[key]=input?input.value:"";
  });
  socket.emit("submit_answers",{code,answers});
};

socket.on("answers_submitted",()=>{
  document.getElementById("ready-btn").disabled=true;
  document.getElementById("submitted").classList.remove("hidden");
  document.getElementById("ready-dot").classList.add("live");
  document.getElementById("ready-text").textContent="Válaszok leadva";
});

socket.on("round_review",data=>{
  currentState="review";categories=data.categories;isHost=!!data.is_host;
  renderReview(data.players,data.round,data.total_rounds);show("review-view");
});

socket.on("review_refresh",data=>{
  if(currentState==="review")renderReview(data.players,currentRound,totalRounds);
});

socket.on("evaluation_update",data=>{
  updateScore(data.player_sid,data.score);
  const yes=document.querySelector(`[data-player="${data.player_sid}"][data-category="${data.category}"][data-value="true"]`);
  const no=document.querySelector(`[data-player="${data.player_sid}"][data-category="${data.category}"][data-value="false"]`);
  if(yes)yes.classList.toggle("selected",data.accepted===true);
  if(no)no.classList.toggle("selected",data.accepted===false);
});

document.getElementById("next-btn").onclick=()=>socket.emit("next_round",{code});

socket.on("game_finished",data=>{
  currentState="finished";
  document.getElementById("progress-bar").style.width="100%";
  const out=document.getElementById("final-results");out.innerHTML="";
  const podium=document.getElementById("podium");podium.innerHTML="";
  const top=data.players.slice(0,3);
  const cls=["second","first","third"];
  const order=[1,0,2];
  order.forEach(idx=>{
    const p=top[idx];if(!p)return;
    const card=document.createElement("div");card.className=`podium-card ${cls[idx]}`;
    const medal=["🥈","🥇","🥉"][idx];
    card.innerHTML=`<div class="podium-place">${medal}</div><div>${esc(p.name)}</div><div class="podium-score">${p.score}</div><div class="muted">pont</div>`;
    podium.appendChild(card);
  });
  data.players.forEach((p,i)=>{
    const row=document.createElement("div");row.className="final-row";
    row.innerHTML=`<span class="place">${i+1}.</span><span>${i===0?"👑 ":""}${esc(p.name)}</span><strong>${p.score} pont</strong>`;
    out.appendChild(row);
  });
  show("finished-view");
});

socket.on("error_message",data=>{
  document.getElementById("error").innerHTML=`<div class="error">${esc(data.message)}</div>`;
});

function renderReview(players, round, total) {

    const table =
        document.getElementById("review-table");

    table.innerHTML = "";

    players.forEach(player => {

        const section =
            document.createElement("div");

        section.className =
            "review-player";

        section.innerHTML = `
            <h3>

                <span>
                    ${esc(player.name)}

                    ${
                        player.is_host
                            ? '<span class="host-badge">👑 HOST</span>'
                            : ''
                    }
                </span>

                <span
                    class="score"
                    data-score="${esc(player.sid)}">

                    ${player.score || 0} pont

                </span>

            </h3>
        `;

        const grid =
            document.createElement("div");

        grid.className =
            "review-grid";


        categories.forEach(([key, label]) => {

            const item =
                document.createElement("div");

            item.className =
                "review-item";


            const answer =
                player.answers &&
                player.answers[key]
                    ? player.answers[key]
                    : "(üres)";


            const answerArea =
                document.createElement("div");

            answerArea.innerHTML = `

                <div class="muted">
                    ${categoryIcons[key] || "✦"}
                    ${esc(label)}
                </div>

                <strong>
                    ${esc(answer)}
                </strong>

            `;


            item.appendChild(answerArea);


            /*
             * A gombokat csak a Host látja.
             */

            if (isHost) {

                const controls =
                    document.createElement("div");

                controls.className =
                    "evaluation-buttons";


                const accept =
                    document.createElement("button");

                accept.className =
                    "eval accepted";

                accept.textContent =
                    "✓";

                accept.title =
                    "Válasz elfogadása";


                const reject =
                    document.createElement("button");

                reject.className =
                    "eval rejected";

                reject.textContent =
                    "✕";

                reject.title =
                    "Válasz elutasítása";


                /*
                 * Korábbi értékelés betöltése
                 */

                const previous =
                    player.accepted &&
                    player.accepted[key];


                if (previous === true) {

                    accept.classList.add(
                        "selected"
                    );

                }

                if (previous === false) {

                    reject.classList.add(
                        "selected"
                    );

                }


                /*
                 * Elfogadás
                 */

                accept.onclick = () => {

                    evaluate(
                        player.sid,
                        key,
                        true
                    );

                };


                /*
                 * Elutasítás
                 */

                reject.onclick = () => {

                    evaluate(
                        player.sid,
                        key,
                        false
                    );

                };


                controls.appendChild(
                    accept
                );

                controls.appendChild(
                    reject
                );

                item.appendChild(
                    controls
                );

            }


            grid.appendChild(item);

        });


        section.appendChild(grid);

        table.appendChild(section);

    });


    /*
     * Következő kör / végeredmény gomb
     */

    const next =
        document.getElementById("next-btn");


    if (isHost) {

        next.classList.remove("hidden");


        if (
            Number(round) >=
            Number(total)
        ) {

            next.textContent =
                "🏆 VÉGEREDMÉNY";

        } else {

            next.textContent =
                "⚡ KÖVETKEZŐ KÖR";

        }

    } else {

        next.classList.add("hidden");

    }


    /*
     * Kör számláló
     */

    const reviewTitle =
        document.getElementById(
            "review-title"
        );


    reviewTitle.textContent =
        `${round}. KÖR / ${total} — ÉRTÉKELÉS`;

}

function evaluate(playerSid,category,accepted){
  socket.emit("accept_answer",{code,player_sid:playerSid,category,accepted});
}
function updateScore(sid,score){
  const e=document.querySelector(`[data-score="${sid}"]`);if(e)e.textContent=`${score} pont`;
}
function show(id){
  ["playing-view","review-view","finished-view"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

        finishedView.classList.remove("hidden");

        players.sort(
            (a, b) =>
                Number(b.score || 0) -
                Number(a.score || 0)
        );

        const podium =
            document.getElementById("podium");

        podium.innerHTML = "";

        const medals = [
            "🥇",
            "🥈",
            "🥉"
        ];

        players
            .slice(0, 3)
            .forEach((player, index) => {

                const card =
                    document.createElement("div");

                card.className =
                    "podium-card " +
                    (
                        index === 0
                            ? "first"
                            : index === 1
                            ? "second"
                            : "third"
                    );

                card.innerHTML = `

                    <div class="trophy">
                        ${medals[index]}
                    </div>

                    <strong>
                        ${esc(player.name)}
                    </strong>

                    <div class="podium-score">
                        ${player.score || 0}
                    </div>

                    <div class="subtitle">
                        pont
                    </div>

                `;

                podium.appendChild(card);
            });

        const results =
            document.getElementById("final-results");

        results.innerHTML = "";

        players.forEach((player, index) => {

            const row =
                document.createElement("div");

            row.className = "final-row";

            row.innerHTML = `

                <div class="place">
                    #${index + 1}
                </div>

                <div style="flex:1">

                    <strong>
                        ${esc(player.name)}
                    </strong>

                </div>

                <strong>
                    ${player.score || 0} pont
                </strong>

            `;

            results.appendChild(row);

        });

    }

</script>
</script>
</body>
</html>
